<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brewmanager - Receitas</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fdfaf6; color: #4a3728; margin: 0; padding: 30px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border-top: 5px solid #6f4e37; padding: 30px 40px; }
        nav { margin-bottom: 25px; }
        nav a { margin-right: 15px; color: #6f4e37; text-decoration: none; font-weight: 600; }
        nav a:hover { text-decoration: underline; }
        h2 { color: #4a3728; border-bottom: 2px solid #f0e6d9; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background-color: #6f4e37; color: white; padding: 10px 15px; text-align: left; }
        td { padding: 10px 15px; border-bottom: 1px solid #f0e6d9; }
        tr:hover { background-color: #fdf5ed; }
        .estrelas { color: #d4a017; letter-spacing: 2px; }
        .btn { display: inline-block; padding: 8px 18px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; cursor: pointer; border: none; font-family: inherit; }
        .btn-primary { background-color: #6f4e37; color: white; }
        .btn-primary:hover { background-color: #5a3e2b; }
        .btn-edit { background-color: #d97706; color: white; }
        .btn-edit:hover { background-color: #b45309; }
        .btn-danger { background-color: #c0392b; color: white; }
        .btn-danger:hover { background-color: #a93226; }
        .btn-ver { background-color: #4a7c59; color: white; }
        .btn-ver:hover { background-color: #3a6347; }
        .btn-export-pdf { background-color: #2c5f8a; color: white; }
        .btn-export-pdf:hover { background-color: #1e4a6e; }
        .btn-export-jpg { background-color: #5a3e8a; color: white; }
        .btn-export-jpg:hover { background-color: #472f6e; }
        .acoes { white-space: nowrap; }
        .vazio { color: #8b5a2b; font-style: italic; text-align: center; padding: 30px 0; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 1000; align-items: center; justify-content: center; }
        .modal-overlay.ativo { display: flex; }
        .modal { background: white; border-radius: 15px; border-top: 5px solid #6f4e37; max-width: 560px; width: 90%; max-height: 85vh; overflow-y: auto; padding: 30px 35px; position: relative; box-shadow: 0 8px 30px rgba(0,0,0,0.2); }
        .modal h3 { color: #4a3728; margin-top: 0; border-bottom: 2px solid #f0e6d9; padding-bottom: 10px; }
        .modal-fechar { position: absolute; top: 15px; right: 20px; font-size: 1.4rem; cursor: pointer; color: #8b5a2b; background: none; border: none; line-height: 1; }
        .modal-fechar:hover { color: #c0392b; }
        .detalhe-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 20px; margin-bottom: 18px; }
        .detalhe-item label { font-size: 0.78rem; color: #8b5a2b; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; display: block; margin-bottom: 2px; }
        .detalhe-item span { font-size: 0.95rem; color: #4a3728; }
        .ingredientes-lista { list-style: none; padding: 0; margin: 0; }
        .ingredientes-lista li { padding: 5px 0; border-bottom: 1px solid #f0e6d9; font-size: 0.9rem; display: flex; justify-content: space-between; }
        .ingredientes-lista li:last-child { border-bottom: none; }
        .ingredientes-lista .qtd { color: #8b5a2b; font-style: italic; }
        .observacoes-texto { background: #fdfaf6; border-left: 3px solid #d4b896; padding: 10px 14px; border-radius: 0 6px 6px 0; font-size: 0.9rem; color: #4a3728; white-space: pre-wrap; }
        .modal-acoes { display: flex; gap: 10px; margin-top: 20px; padding-top: 18px; border-top: 1px solid #f0e6d9; flex-wrap: wrap; }
        .sem-dado { color: #b0897a; font-style: italic; }
        .secao-titulo { font-size: 0.82rem; color: #6f4e37; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; margin: 16px 0 8px; border-bottom: 1px solid #f0e6d9; padding-bottom: 4px; }
        .secao-titulo:first-child { margin-top: 0; }
    </style>
</head>
<body>
<div class="container">
    <nav>
        <a th:href="@{/}">☕ Início</a>
        <a th:href="@{/cafes}">Cafés</a>
        <a th:href="@{/tipos-infusao}">Métodos</a>
        <a th:href="@{/receitas}">Receitas</a>
        <a th:href="@{/timer}">Timer</a>
    </nav>

    <h2>Receitas de Preparo</h2>

    <a th:href="@{/receitas/novo}" class="btn btn-primary">+ Nova Receita</a>

    <table th:if="${!receitas.isEmpty()}">
        <thead>
        <tr>
            <th>Café</th>
            <th>Método</th>
            <th>Proporção</th>
            <th>Tempo (s)</th>
            <th>Nota</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="receita : ${receitas}">
            <td th:text="${receita.cafe != null ? receita.cafe.nome : '-'}"></td>
            <td th:text="${receita.tipoInfusao != null ? receita.tipoInfusao.nome : '-'}"></td>
            <td th:text="${receita.proporcao}"></td>
            <td th:text="${receita.tempoInfusao}"></td>
            <td>
                <span class="estrelas" th:text="${'★'.repeat(receita.notaSensorial != null ? receita.notaSensorial : 0)}"></span>
                <span th:text="${'☆'.repeat(5 - (receita.notaSensorial != null ? receita.notaSensorial : 0))}"></span>
            </td>
            <td class="acoes">
                <button class="btn btn-ver" style="margin-right:5px;"
                        th:onclick="|abrirModal(${receita.id})|">👁 Ver</button>
                <a th:href="@{/receitas/{id}/editar(id=${receita.id})}" class="btn btn-edit" style="margin-right: 5px;">✏ Editar</a>
                <a th:href="@{/receitas/{id}/excluir(id=${receita.id})}" class="btn btn-danger"
                   onclick="return confirm('Excluir esta receita?')">🗑 Excluir</a>
            </td>
        </tr>
        </tbody>
    </table>

    <p class="vazio" th:if="${receitas.isEmpty()}">Nenhuma receita registrada ainda.</p>
</div>

<!-- Modal de Detalhes -->
<div class="modal-overlay" id="modalOverlay" onclick="fecharModalOverlay(event)">
    <div class="modal">
        <button class="modal-fechar" onclick="fecharModal()">✕</button>
        <h3>☕ Detalhes da Receita</h3>

        <div id="modalConteudo">
            <div class="secao-titulo">Café</div>
            <div class="detalhe-grid">
                <div class="detalhe-item">
                    <label>Nome</label>
                    <span id="d-cafeName"></span>
                </div>
                <div class="detalhe-item">
                    <label>Marca / Torrefação</label>
                    <span id="d-cafeMarca"></span>
                </div>
                <div class="detalhe-item">
                    <label>Origem</label>
                    <span id="d-cafeOrigem"></span>
                </div>
                <div class="detalhe-item">
                    <label>Nível de Torra</label>
                    <span id="d-cafeTorra"></span>
                </div>
                <div class="detalhe-item">
                    <label>Tipo</label>
                    <span id="d-cafeTipo"></span>
                </div>
                <div class="detalhe-item">
                    <label>Moagem</label>
                    <span id="d-cafeMoagem"></span>
                </div>
            </div>

            <div class="secao-titulo">Preparo</div>
            <div class="detalhe-grid">
                <div class="detalhe-item">
                    <label>Método</label>
                    <span id="d-tipoInfusao"></span>
                </div>
                <div class="detalhe-item">
                    <label>Proporção</label>
                    <span id="d-proporcao"></span>
                </div>
                <div class="detalhe-item">
                    <label>Tempo de Infusão</label>
                    <span id="d-tempoInfusao"></span>
                </div>
                <div class="detalhe-item">
                    <label>Nota Sensorial</label>
                    <span id="d-notaSensorial" class="estrelas"></span>
                </div>
            </div>

            <div class="secao-titulo">Ingredientes</div>
            <ul class="ingredientes-lista" id="d-ingredientes"></ul>

            <div id="d-observacoesWrap" style="display:none;">
                <div class="secao-titulo">Observações</div>
                <div class="observacoes-texto" id="d-observacoes"></div>
            </div>
        </div>

        <div class="modal-acoes">
            <button class="btn btn-export-pdf" onclick="exportarPDF()">📄 Exportar PDF</button>
            <button class="btn btn-export-jpg" onclick="exportarJPG()">🖼 Exportar JPG</button>
            <button class="btn" style="background:#f0e6d9;color:#4a3728;margin-left:auto;" onclick="fecharModal()">Fechar</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
    var nomeReceitaAtual = 'receita';

    function val(v) {
        return v ? v : '<span class="sem-dado">—</span>';
    }

    function abrirModal(id) {
        fetch('/receitas/' + id + '/detalhes')
            .then(function(r) { return r.json(); })
            .then(function(d) {
                document.getElementById('d-cafeName').innerHTML = val(d.cafeName);
                document.getElementById('d-cafeMarca').innerHTML = val(d.cafeMarca);
                document.getElementById('d-cafeOrigem').innerHTML = val(d.cafeOrigem);
                document.getElementById('d-cafeTorra').innerHTML = val(d.cafeTorra);
                document.getElementById('d-cafeTipo').innerHTML = val(d.cafeTipo);
                document.getElementById('d-cafeMoagem').innerHTML = val(d.cafeMoagem);
                document.getElementById('d-tipoInfusao').innerHTML = val(d.tipoInfusao);
                document.getElementById('d-proporcao').innerHTML = val(d.proporcao);
                document.getElementById('d-tempoInfusao').innerHTML = d.tempoInfusao
                    ? d.tempoInfusao + 's'
                    : '<span class="sem-dado">—</span>';

                var nota = d.notaSensorial || 0;
                document.getElementById('d-notaSensorial').textContent =
                    '★'.repeat(nota) + '☆'.repeat(5 - nota);

                var ul = document.getElementById('d-ingredientes');
                ul.innerHTML = '';
                if (d.ingredientes && d.ingredientes.length > 0) {
                    d.ingredientes.forEach(function(ing) {
                        var li = document.createElement('li');
                        li.innerHTML = '<span>' + ing.nome + '</span><span class="qtd">' + ing.quantidade + '</span>';
                        ul.appendChild(li);
                    });
                } else {
                    ul.innerHTML = '<li><span class="sem-dado">Nenhum ingrediente registrado</span></li>';
                }

                var obsWrap = document.getElementById('d-observacoesWrap');
                if (d.observacoes && d.observacoes.trim()) {
                    document.getElementById('d-observacoes').textContent = d.observacoes;
                    obsWrap.style.display = 'block';
                } else {
                    obsWrap.style.display = 'none';
                }

                nomeReceitaAtual = (d.cafeName || 'receita').toLowerCase().replace(/\s+/g, '_');
                document.getElementById('modalOverlay').classList.add('ativo');
            })
            .catch(function() {
                alert('Erro ao carregar detalhes da receita.');
            });
    }

    function fecharModal() {
        document.getElementById('modalOverlay').classList.remove('ativo');
    }

    function fecharModalOverlay(event) {
        if (event.target === document.getElementById('modalOverlay')) fecharModal();
    }

    function exportarJPG() {
        var conteudo = document.getElementById('modalConteudo');
        html2canvas(conteudo, { backgroundColor: '#ffffff', scale: 2 }).then(function(canvas) {
            var link = document.createElement('a');
            link.download = nomeReceitaAtual + '.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.92);
            link.click();
        });
    }

    function exportarPDF() {
        var conteudo = document.getElementById('modalConteudo');
        html2canvas(conteudo, { backgroundColor: '#ffffff', scale: 2 }).then(function(canvas) {
            var imgData = canvas.toDataURL('image/jpeg', 0.92);
            var pdf = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            var pageWidth = pdf.internal.pageSize.getWidth();
            var imgWidth = pageWidth - 20;
            var imgHeight = (canvas.height * imgWidth) / canvas.width;
            var maxHeight = pdf.internal.pageSize.getHeight() - 20;
            if (imgHeight > maxHeight) imgHeight = maxHeight;
            pdf.addImage(imgData, 'JPEG', 10, 10, imgWidth, imgHeight);
            pdf.save(nomeReceitaAtual + '.pdf');
        });
    }
</script>
</body>
</html>
