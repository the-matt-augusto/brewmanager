<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee App - Bem-vindo</title>
    <style>
        /* Estilos básicos para uma aparência limpa e temática */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #fdfaf6; /* Tom creme suave */
            color: #4a3728; /* Marrom café escuro */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-top: 5px solid #6f4e37; /* Detalhe em marrom café */
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1rem;
            color: #8b5a2b;
        }
        .icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon">☕</div>
    <h1>Hello, Coffee World!</h1>
    <p>Sua jornada para o café perfeito começa aqui.</p>
    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
    <small>Stack: Spring Boot + Thymeleaf + SQLite</small>
</div>

</body>
</html>
